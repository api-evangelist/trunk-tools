name: Trunk Tools
description: Trunk Tools is a construction-technology company building an AI/ML platform that helps
  general contractors, specialty contractors, and owners make sense of project data buried in
  documents and automate repetitive, time-intensive workflows. Founded in 2021 with offices in New
  York, Austin, and Santa Barbara, its products include TrunkText (instant answers from project
  documents via a construction AI agent), TrunkSubmittal and an auto-generated Submittal Register,
  TrunkReview (drawing-revision change detection), TrunkRFI, and TrunkBid. The platform ingests
  structured and unstructured construction data (PDF, XER, MPP, CSV) and connects to major project
  and document management systems such as Procore, Autodesk, CMiC, SharePoint, Box, Dropbox, and
  Egnyte. Backed by Insight Partners and Redpoint Ventures.
